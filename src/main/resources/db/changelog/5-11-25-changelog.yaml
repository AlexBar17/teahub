databaseChangeLog:
  - changeSet:
      id: 0
      author: kraken
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            tableName: tea
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_tea
              - column:
                  name: version
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: origin_country
                  type: varchar(255)
              - column:
                  name: origin_region
                  type: varchar(255)
              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: text
              - column:
                  name: price
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime
              - column:
                  name: updated_at
                  type: datetime
        - createIndex:
            tableName: tea
            indexName: idx_tea_type
            columns:
              - column:
                  name: type
        - createIndex:
            tableName: tea
            indexName: idx_tea_origin_country
            columns:
              - column:
                  name: origin_country
        - createIndex:
            tableName: tea
            indexName: idx_tea_origin_region
            columns:
              - column:
                  name: origin_region
