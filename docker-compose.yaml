services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: teahub
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - teahub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d teahub" ]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8085:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  teahub_pgdata:
